name: Python app checks

on:
  push:
    branches:
      - main
      - fix/streamlit-deployment-20261009
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py
      - name: Check app imports
        run: python -c "import streamlit; from google import genai; from dotenv import load_dotenv"
